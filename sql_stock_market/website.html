<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOO Stock Analysis (run voodata.py to see graph)</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>VOO Stock Price</h1>

    <canvas id="vooChart"></canvas>

    <script>

        async function loadVOO() {

            const response = await fetch(
                "http://127.0.0.1:5000/api/voo"
            );

            const data = await response.json();

            const dates = data.map(row => row.date);
            const prices = data.map(row => row.close);

            const ctx = document
                .getElementById("vooChart")
                .getContext("2d");

            new Chart(ctx, {

                type: "line",

                data: {

                    labels: dates,

                    datasets: [{
                        label: "VOO Closing Price",
                        data: prices,
                        borderWidth: 2,
                        pointRadius: 0
                    }]

                },

                options: {

                    responsive: true,

                    scales: {

                        x: {
                            title: {
                                display: true,
                                text: "Date"
                            }
                        },

                        y: {
                            title: {
                                display: true,
                                text: "Price ($)"
                            }
                        }

                    }

                }

            });

        }

        loadVOO();

    </script>

</body>

</html>
